[project]
name = "mcp-ffmpeg"
version = "0.1.5"
description = "A Model Context Protocol server for FFmpeg media processing"
readme = "README.md"
authors = [
    { name = "Priyanshu", email = "mehtapriyanshu408@gmail.com" }
]
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "ffmpeg", "video", "audio", "processing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "ffmpeg-python>=0.2.0",
    "httpx>=0.20.0",
    "mcp[cli]>=1.0.0",
    "openai-whisper>=20250625",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/priyanshum143/MCP-FFMPEG"
Issues = "https://github.com/priyanshum143/MCP-FFMPEG/issues"

[project.scripts]
mcp-ffmpeg = "MCP_ffmpeg.mcp_server:run"
mcp-ffmpeg-cli = "MCP_ffmpeg.main:run_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["src/MCP_ffmpeg"]
